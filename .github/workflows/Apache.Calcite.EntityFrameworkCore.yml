name: Apache.Calcite.EntityFrameworkCore

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to nuget.org, creating the GitHub release if one does not exist.
        type: boolean
        default: false
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  release:
    types:
    - created

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: 6.x
    - name: Execute GitVersion
      uses: gittools/actions/gitversion/execute@v3
      with:
        useConfigFile: true
    - name: Authenticate NuGet Source (GitHub)
      shell: pwsh
      run: dotnet nuget update source ${{ github.repository_owner }} --source $env:GITHUB_REPOS --username USERNAME --password $env:GITHUB_TOKEN --store-password-in-clear-text
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: NuGet Restore
      run: dotnet restore Apache.Calcite.EntityFrameworkCore.slnx
    - name: Build
      run: |
        dotnet msbuild /m /bl \
          /p:Configuration="Release" \
          /p:Platform="Any CPU" \
          /p:PreReleaseLabel=${GitVersion_PreReleaseLabel} \
          /p:PreReleaseNumber=${GitVersion_WeightedPreReleaseNumber} \
          /p:Version=${GitVersion_FullSemVer} \
          /p:AssemblyVersion=${GitVersion_AssemblySemVer} \
          /p:InformationalVersion=${GitVersion_InformationalVersion} \
          /p:FileVersion=${GitVersion_AssemblySemFileVer} \
          /p:PackageVersion=${GitVersion_FullSemVer} \
          /p:RepositoryUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
          /p:PackageProjectUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          /p:BuildInParallel=true \
          /p:ContinuousIntegrationBuild=true \
          Apache.Calcite.EntityFrameworkCore.dist.msbuildproj
    - name: Upload MSBuild Log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: msbuild.binlog
        path: msbuild.binlog
    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget
        path: dist/nuget
    - name: Package Tests
      run: tar czvf tests.tar.gz tests
      working-directory: dist
    - name: Upload Tests
      uses: actions/upload-artifact@v4
      with:
        name: tests
        path: dist/tests.tar.gz
    - name: Package Benchmarks
      run: tar czvf benchmarks.tar.gz benchmarks
      working-directory: dist
    - name: Upload Benchmarks
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks
        path: dist/benchmarks.tar.gz
  test:
    strategy:
      matrix:
        run:
        - Apache.Calcite.EntityFrameworkCore.Adapter.Tests
        - Apache.Calcite.EntityFrameworkCore.Tests
        - Apache.Calcite.EntityFrameworkCore.FunctionalTests
        sys:
        - win-x64
        - linux-x64
        - linux-arm64
        - osx-arm64
        tfm:
        - net10.0
        exclude:
        - tfm: net472
          sys: linux-x64
        - tfm: net472
          sys: linux-arm64
        - tfm: net472
          sys: osx-arm64
    name: Test (${{ matrix.run }}:${{ matrix.tfm }}:${{ matrix.sys }})
    needs:
    - build
    runs-on: ${{ fromJSON('{"win-x64":["windows-2022"],"linux-x64":["ubuntu-22.04"],"linux-arm64":["ubuntu-22.04-arm"],"osx-x64":["macos-13"],"osx-arm64":["macos-14"]}')[matrix.sys] }}
    steps:
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # This job never checks the repository out, so the nuget.config that names the feed is not on disk
    # and there is no source here to authenticate: it has to be added outright. The build job, which
    # does check out, updates the source its config already names instead — adding it there fails on the
    # name being taken.
    - name: Add NuGet Source (GitHub)
      shell: pwsh
      run: dotnet nuget add source $env:GITHUB_REPOS --name ${{ github.repository_owner }} --username USERNAME --password $env:GITHUB_TOKEN --store-password-in-clear-text
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Download Tests
      uses: actions/download-artifact@v4
      with:
        name: tests
    - name: Restore Tests
      run: tar xzvf tests.tar.gz
    - name: Execute Tests
      timeout-minutes: 480
      shell: pwsh
      run: |
        # assign powershell variables
        $run = "${{ matrix.run }}"
        $tfm = "${{ matrix.tfm }}"
        $sys = "${{ matrix.sys }}"

        # suite name can contain filter expression after ?
        $split = $run.IndexOf("?")
        if ($split -gt -1) {
            $tst = $run.Substring(0, $split)
            $qry = $run.Substring($split + 1)
        } else {
            $tst = $run
        }

        # scan and process test assemblies
        # the suite's own assembly, exactly: a *.Tests.dll glob catches reference assemblies
        # like Microsoft.EntityFrameworkCore.Relational.Specification.Tests.dll
        $tests = $(gi .\tests\$tst\$tfm\$tst.dll)
        if ($tests) {
            $argl = @(
                "-f", $tfm,
                "-v:diag",
                "--results-directory", "TestResults",
                "--logger:console;verbosity=diag",
                "--logger:trx"
            )
            
            $runsettings = $(gi .\tests\$tst\$tfm\*.runsettings)
            if ($runsettings) {
                $argl += "--settings:$runsettings"
            }

            if ($qry -ne "" -and $qry -ne $null) {
                $argl += @("--filter", $qry)
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst-$qry--$tfm--$sys"
            } else {
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst--$tfm--$sys"
            }
            
            dotnet test @argl $tests[0].FullName
        }
    - name: Archive Test Results
      if: always() && startsWith(env.RET, 'TestResults--')
      run: tar czvf TestResults.tar.gz TestResults
    - name: Upload Test Results
      if: always() && startsWith(env.RET, 'TestResults--')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RET }}
        path: TestResults.tar.gz
  # A timing from a shared runner is not a number worth keeping, so this stage runs the two switches that are
  # worth gating on instead: `--verify` executes every benchmark once and exits non-zero naming the ones this
  # build cannot answer, and `--plans` says which shapes reached the EfCore convention and which fell back. Both
  # run in-process, so neither needs BenchmarkDotNet's toolchain to rebuild anything on the runner. Split by
  # platform because that is where the answers differ: IKVM, the JVM and SQLite are all per-RID underneath, and a
  # shape that plans on linux-x64 is not thereby known to plan on osx-arm64. Full timings stay local, per the
  # suites' own READMEs.
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        run:
        - Apache.Calcite.EntityFrameworkCore.Adapter.Benchmarks
        - Apache.Calcite.EntityFrameworkCore.Benchmarks
        sys:
        - win-x64
        - linux-x64
        - linux-arm64
        - osx-arm64
        tfm:
        - net10.0
    name: Benchmark (${{ matrix.run }}:${{ matrix.tfm }}:${{ matrix.sys }})
    needs:
    - build
    runs-on: ${{ fromJSON('{"win-x64":["windows-2022"],"linux-x64":["ubuntu-22.04"],"linux-arm64":["ubuntu-22.04-arm"],"osx-x64":["macos-13"],"osx-arm64":["macos-14"]}')[matrix.sys] }}
    steps:
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Download Benchmarks
      uses: actions/download-artifact@v4
      with:
        name: benchmarks
    - name: Restore Benchmarks
      run: tar xzvf benchmarks.tar.gz
    - name: Verify Benchmarks
      timeout-minutes: 120
      shell: pwsh
      run: |
        $run = "${{ matrix.run }}"
        $tfm = "${{ matrix.tfm }}"
        $sys = "${{ matrix.sys }}"

        New-Item -ItemType Directory -Force -Path BenchmarkResults | Out-Null
        Add-Content $env:GITHUB_ENV "`nBER=BenchmarkResults--$run--$tfm--$sys"

        # Resolve through the provider so the path separators are this platform's: the artifact is laid out by
        # dist-benchmarks, and the string is handed to a native process that will not normalise it.
        $dll = $(gi (Join-Path "benchmarks" $run $tfm "$run.dll"))
        dotnet $dll.FullName --verify | Tee-Object -FilePath (Join-Path "BenchmarkResults" "verify.txt")
    - name: Explain Plans
      # The plan report is most wanted exactly when the verify above went red, so it is not skipped by it. Only
      # the adapter suite has plans to explain; the provider suite reaches Calcite through EF Core.
      if: always() && matrix.run == 'Apache.Calcite.EntityFrameworkCore.Adapter.Benchmarks'
      timeout-minutes: 60
      shell: pwsh
      run: |
        $run = "${{ matrix.run }}"
        $tfm = "${{ matrix.tfm }}"

        New-Item -ItemType Directory -Force -Path BenchmarkResults | Out-Null
        $dll = $(gi (Join-Path "benchmarks" $run $tfm "$run.dll"))
        dotnet $dll.FullName --plans | Tee-Object -FilePath (Join-Path "BenchmarkResults" "plans.txt")
    - name: Archive Benchmark Results
      if: always() && startsWith(env.BER, 'BenchmarkResults--')
      run: tar czvf BenchmarkResults.tar.gz BenchmarkResults
    - name: Upload Benchmark Results
      if: always() && startsWith(env.BER, 'BenchmarkResults--')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BER }}
        path: BenchmarkResults.tar.gz
  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs:
    - test
    - benchmark
    runs-on: ubuntu-22.04
    env:
      # One switch for the GitHub release and the nuget.org push together, so neither happens without the
      # other. Nothing reaches nuget.org implicitly: either a tag drives the build, or the run was asked
      # for it by hand. The GitHub Packages push below is not gated by this and still runs on every build.
      PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish == true }}
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: 6.x
    - name: Execute GitVersion
      id: GitVersion
      uses: gittools/actions/gitversion/execute@v3
      with:
        useConfigFile: true
    - name: Download NuGet Packages
      uses: actions/download-artifact@v4
      with:
        name: nuget
        path: dist/nuget
    # `commit` is what lets this run from a branch: with no tag of this name yet the action creates one
    # there, so the tag is a product of the build rather than something to remember to make, and to keep
    # in order. Where the tag does already exist and carries a release -- an explicit tag build, or a
    # re-run -- allowUpdates keeps that from failing and updates it in place instead,
    # omitBodyDuringUpdate leaves notes written by hand alone, and replacesArtifacts refreshes the
    # packages rather than colliding with the ones already attached.
    - name: Create Release
      if: env.PUBLISH == 'true'
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.GitVersion.outputs.semVer }}
        commit: ${{ github.sha }}
        allowUpdates: true
        omitBodyDuringUpdate: true
        replacesArtifacts: true
        artifacts: dist/nuget/*.nupkg,dist/nuget/*.snupkg
        prerelease: ${{ contains(steps.GitVersion.outputs.semVer, '-') }}
        makeLatest: ${{ !contains(steps.GitVersion.outputs.semVer, '-') }}
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Push NuGet (GitHub)
      if: github.event_name != 'pull_request'
      shell: pwsh
      run: dotnet nuget push dist/nuget/*.nupkg --source $env:GITHUB_REPOS --api-key $env:GITHUB_TOKEN --skip-duplicate
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Push NuGet
      if: env.PUBLISH == 'true'
      shell: pwsh
      run: dotnet nuget push dist/nuget/*.nupkg --source $env:NUGET_REPOS --api-key $env:NUGET_TOKEN --skip-duplicate
      env:
        NUGET_REPOS: https://api.nuget.org/v3/index.json
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
